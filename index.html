<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Landing Page Terceirize</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body>
    <header id="base">
        <div class="container">

            <div class="flex">
                
                <div class="media_slot"
                    data-type="media"
                    data-txt-type="row"
                    data-content="[Terceirize_Empresas.Logo(transparent)]">
                    
                    <a href="#home">
                        <i class="bi" data-icon="&#xF219"></i>
                        <img src="" alt="TE_logo">
                    </a>

                </div>

                <nav>
                    <ul>
                        <li><a href="#home">home</a></li>
                        <li><a href="#segmentogits">segmentos</a></li>
                        <li><a href="#serviços">serviços</a></li>
                        <li><a href="#blog">blog</a></li>
                        <li><a href="#faq">faq</a></li>
                    </ul>
                </nav>

                
                <div class="contato">
                    <a href="#contato">
                        <button>
                            <i class="bi bi-telephone"></i>
                            contato
                        </button>
                    </a>
                </div>

            </div>

        </div>
    </header><!--header-->
    
    <section class="banner">
        <h1 data-type="txt">voce trabalha o mês inteiro e <span class="destaque"> o lucro não aparece</span><span class="per_mark">?</span></h1>

        <div class="container">

            <a href="#diagnostico" class="agendar" data-type="btn">
                <button>agendar diagnóstico gratuito</button>
            </a>

            <p data-type="txt">
                Preso na operação, sem tempo e sem clareza de quanto entra, sai e sobra. A gente assume seu financeiro de ponta a ponta — você se liberta pra crescer e finalmente 
                <span class="line">enxerga o lucro do seu negócio.</span>
            </p>
        </div>
    </section><!--banner-->
</body>
</html>
